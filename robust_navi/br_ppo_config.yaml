defaults:
  - _self_
  - workspace_config
  - agent: ppo
  - crowd_policy: diverse_recurrent_ppo
  - crowd_sim_env: RobotCrowdSim
  - override hydra/launcher: submitit_slurm

hydra:
  run:
    dir: ./exp_local/${now:%Y.%m.%d}/${now:%H%M%S}_${agent.name}_${crowd_policy.name}
  sweep:
    dir: ./exp_paper/${now:%Y.%m.%d}/${now:%H%M%S}_${agent.name}_${crowd_policy.name}
    subdir: ${hydra.job.num}
  launcher:
    timeout_min: 4300
    cpus_per_task: 10
    gpus_per_node: 1
    tasks_per_node: 1
    mem_gb: 400
    nodes: 1
    submitit_folder: ./exp_paper/${now:%Y.%m.%d}/${now:%H%M%S}_${agent.name}_${crowd_policy.name}/.slurm
    partition: learnlab # devlab learnlab



